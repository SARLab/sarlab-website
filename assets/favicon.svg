<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="22" cy="22" r="21" fill="#0f172a" stroke="url(#iconGradient)" stroke-width="2"/>
  
  <!-- Radar rings -->
  <circle cx="22" cy="22" r="14" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="22" cy="22" r="8" fill="none" stroke="url(#iconGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Crosshairs -->
  <line x1="22" y1="6" x2="22" y2="38" stroke="url(#iconGradient)" stroke-width="1" opacity="0.3"/>
  <line x1="6" y1="22" x2="38" y2="22" stroke="url(#iconGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Center -->
  <circle cx="22" cy="22" r="3" fill="url(#iconGradient)"/>
  
  <!-- Sweep indicator -->
  <path d="M 22 22 L 22 6 A 16 16 0 0 1 34 12 Z" fill="url(#iconGradient)" opacity="0.25"/>
  
  <!-- Signal pulse -->
  <circle cx="34" cy="12" r="2" fill="#22c55e"/>
</svg>