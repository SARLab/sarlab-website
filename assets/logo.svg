<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Radar Icon -->
  <g transform="translate(8, 8)">
    <!-- Outer ring -->
    <circle cx="22" cy="22" r="20" fill="none" stroke="url(#radarGradient)" stroke-width="2"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="url(#radarGradient)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="22" cy="22" r="8" fill="none" stroke="url(#radarGradient)" stroke-width="1" opacity="0.4"/>
    
    <!-- Crosshairs -->
    <line x1="22" y1="4" x2="22" y2="40" stroke="url(#radarGradient)" stroke-width="1" opacity="0.3"/>
    <line x1="4" y1="22" x2="40" y2="22" stroke="url(#radarGradient)" stroke-width="1" opacity="0.3"/>
    
    <!-- Center dot -->
    <circle cx="22" cy="22" r="3" fill="url(#radarGradient)"/>
    
    <!-- Sweep arc -->
    <path d="M 22 22 L 22 4 A 18 18 0 0 1 36 12 Z" fill="url(#radarGradient)" opacity="0.3"/>
    
    <!-- Signal waves -->
    <path d="M 38 10 Q 42 8 44 12" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 40 7 Q 46 4 48 10" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- SARLab Text -->
  <g transform="translate(56, 18)">
    <text x="0" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="url(#logoGradient)">SARLab</text>
  </g>
</svg>